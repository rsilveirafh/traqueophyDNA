name: Atualiza dados

on:
  schedule:
    # domingo, 06:17 UTC (03:17 em Brasília)
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      max_genbank:
        description: "Máximo de consultas ao GenBank nesta execução (vazio = sem limite)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualiza-dados
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Coleta (listas, CTFB, BOLD, GenBank)
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          ARGS="--max-minutos=270"
          if [ -n "${{ github.event.inputs.max_genbank }}" ]; then
            ARGS="$ARGS --max-genbank=${{ github.event.inputs.max_genbank }}"
          fi
          Rscript scripts/atualiza.R $ARGS

      - name: Grava os dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data data-raw
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: atualização semanal $(date -u +%Y-%m-%d)"
            git push
          fi

  publica:
    needs: coleta
    uses: ./.github/workflows/publica.yml
    permissions:
      contents: read
      pages: write
      id-token: write
